<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Editor</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #EFE4B0;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 1px solid #000;
        }
        button {
            margin-top: 10px;
        }
        .button-container {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="button-container">
        <button id="drawLineButton">Нарисовать линию</button>
        <button id="addCameraButton">Добавить камеру</button>
        <button id="saveButton">Сохранить</button>
    </div>
    <canvas id="maze" width="500" height="500"></canvas>
    <script src="maze-editor.js"></script>
</body>
</html>
