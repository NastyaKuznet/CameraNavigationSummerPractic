<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графический редактор</title>
    <style>
        canvas {
            border: 1px solid #000;
            background-color: #efe4b0;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            width: 200px;
        }
        .camera-list {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div style="display: flex;">
        <canvas id="canvas" width="800" height="600"></canvas>
        <div class="sidebar">
            <button onclick="saveData()">Сохранить</button>
            <button onclick="toggleCameraMode()">Режим добавления камеры</button>
            <div id="cameraControls" style="display: none;">
                <label>Угол обзора: <input type="number" id="cameraAngle" min="1" max="180" value="60"></label>
                <label>Длина обзора: <input type="number" id="cameraLength" min="10" max="300" value="100"></label>
                <button onclick="updateCamera()">Обновить камеру</button>
            </div>

            <div class="camera-list" id="cameraList"></div>
        </div>
    </div>
    <script src="editor.js"></script>
</body>
</html>
